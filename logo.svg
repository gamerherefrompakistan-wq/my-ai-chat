<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>
    .robot-body { animation: float 3s ease-in-out infinite; transform-origin: 340px 215px; }
    .eye-left { animation: blink 4s ease-in-out infinite; transform-origin: 279px 200px; }
    .eye-right { animation: blink 4s ease-in-out infinite; transform-origin: 402px 200px; }
    .antenna-left { animation: wiggle 3s ease-in-out infinite; transform-origin: 205px 94px; }
    .antenna-right { animation: wiggle2 3s ease-in-out infinite; transform-origin: 475px 94px; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
    @keyframes wiggle2 { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(8deg); } 75% { transform: rotate(-8deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.28; } }
  </style>
  <circle class="glow" cx="340" cy="210" r="195" fill="#3b3fe8"/>
  <g class="robot-body">
    <g class="antenna-left"><rect x="198" y="42" width="14" height="52" rx="7" fill="#3b3fe8"/></g>
    <g class="antenna-right"><rect x="468" y="42" width="14" height="52" rx="7" fill="#3b3fe8"/></g>
    <path d="M178 175 Q118 155 128 230 Q132 265 162 268" stroke="#3b3fe8" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M502 175 Q562 155 552 230 Q548 265 518 268" stroke="#3b3fe8" stroke-width="30" fill="none" stroke-linecap="round"/>
    <ellipse cx="340" cy="215" rx="185" ry="165" fill="#3b3fe8"/>
    <polygon points="255,355 220,395 310,358" fill="#3b3fe8"/>
    <rect x="218" y="125" width="244" height="180" rx="38" fill="white"/>
    <g class="eye-left"><path d="M268 205 Q278 190 290 205" stroke="#3b3fe8" stroke-width="11" fill="none" stroke-linecap="round"/></g>
    <g class="eye-right"><path d="M390 205 Q402 190 414 205" stroke="#3b3fe8" stroke-width="11" fill="none" stroke-linecap="round"/></g>
    <path d="M305 248 Q340 272 375 248" stroke="#3b3fe8" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
