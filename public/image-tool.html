<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Image Generator — My AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04060f;
      --surface: #0a0f1e;
      --card: #0f1628;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(99,102,241,0.4);
      --accent: #6366f1;
      --accent2: #ec4899;
      --accent3: #06b6d4;
      --text: #f0f4ff;
      --muted: #4a5580;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; opacity: 0.18; animation: orbFloat 8s ease-in-out infinite; }
    .orb1 { width: 400px; height: 400px; background: #6366f1; top: -100px; left: -100px; }
    .orb2 { width: 300px; height: 300px; background: #ec4899; bottom: -50px; right: -50px; animation-delay: -4s; }
    .orb3 { width: 200px; height: 200px; background: #06b6d4; top: 50%; left: 50%; animation-delay: -2s; }
    @keyframes orbFloat { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-20px) scale(1.1); } }
    .topbar { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--border); background: rgba(4,6,15,0.8); backdrop-filter: blur(20px); }
    .logo-wrap { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-wrap img { height: 38px; mix-blend-mode: screen; }
    .brand-name { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; background: linear-gradient(135deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .back-btn { display: flex; align-items: center; gap: 8px; padding: 8px 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: #a0aec0; text-decoration: none; font-size: 13px; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .back-btn:hover { border-color: var(--border-hover); color: var(--text); background: #161d35; }
    .main { position: relative; z-index: 1; display: grid; grid-template-columns: 380px 1fr; gap: 0; min-height: calc(100vh - 69px); }
    .left-panel { border-right: 1px solid var(--border); padding: 28px 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
    .panel-title { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .field-group { display: flex; flex-direction: column; gap: 8px; }
    .field-label { font-size: 12px; font-weight: 500; color: #7888aa; letter-spacing: 0.5px; }
    textarea, input[type="number"] { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 12px 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; resize: none; }
    textarea:focus, input[type="number"]:focus { border-color: rgba(99,102,241,0.5); box-shadow: 0 0 0 3px rgba(99,102,241,0.08); }
    textarea { min-height: 110px; }
    .size-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .preset-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: #7888aa; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .preset-btn:hover, .preset-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,0.08); }
    .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .style-btn { padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: #7888aa; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center; font-family: 'DM Sans', sans-serif; }
    .style-btn:hover, .style-btn.active { border-color: var(--accent); color: var(--text); background: rgba(99,102,241,0.1); }
    .generate-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; transition: all 0.3s; position: relative; overflow: hidden; }
    .generate-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #818cf8, #a855f7); opacity: 0; transition: opacity 0.3s; }
    .generate-btn:hover::before { opacity: 1; }
    .generate-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }
    .generate-btn:active { transform: translateY(0); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .generate-btn span { position: relative; z-index: 1; }
    .right-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; position: relative; }
    .loading-screen { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 28px; position: absolute; inset: 0; z-index: 5; }
    .loading-screen.show { display: flex; }
    .logo-loader { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
    .logo-loader img { width: 80px; height: 80px; mix-blend-mode: screen; animation: logoPulse 2s ease-in-out infinite; }
    .logo-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; animation: ringRotate 2s linear infinite; }
    .logo-ring::before { content: ''; position: absolute; inset: -2px; border-radius: 50%; padding: 2px; background: conic-gradient(from 0deg, #6366f1, #ec4899, #06b6d4, #6366f1); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
    .logo-ring2 { position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgba(99,102,241,0.2); animation: ringRotate 3s linear infinite reverse; }
    @keyframes logoPulse { 0%,100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.08); filter: brightness(1.3); } }
    @keyframes ringRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .loading-text { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 600; color: var(--text); text-align: center; }
    .loading-sub { font-size: 13px; color: var(--muted); text-align: center; margin-top: -16px; }
    .loading-bar-wrap { width: 220px; height: 3px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .loading-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #ec4899); border-radius: 999px; animation: barFill 30s linear forwards; }
    @keyframes barFill { 0% { width: 0%; } 80% { width: 85%; } 100% { width: 90%; } }
    .loading-dots { display: flex; gap: 6px; margin-top: -8px; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dotPop 1.2s ease-in-out infinite; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; background: var(--accent2); }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; background: var(--accent3); }
    @keyframes dotPop { 0%,100% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1.2); opacity: 1; } }
    .empty-state { display: flex; flex-direction: column; align-items: center; gap: 16px; opacity: 0.4; }
    .empty-icon { width: 80px; height: 80px; border: 2px dashed var(--muted); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .empty-state p { font-size: 14px; color: var(--muted); font-family: 'Syne', sans-serif; }
    .image-wrap { display: none; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 600px; animation: fadeUp 0.5s ease both; }
    .image-wrap.show { display: flex; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    #output { width: 100%; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: block; }
    .image-actions { display: flex; gap: 10px; width: 100%; }
    .action-btn { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .action-btn:hover { border-color: var(--border-hover); background: #161d35; }
    .action-btn.primary { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.3); color: #a5b4fc; }
    .action-btn.primary:hover { background: rgba(99,102,241,0.25); }
    .status-badge { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; }
    .status-badge.success { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
    .status-badge.error { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
    #imageUrl { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-size: 11px; padding: 8px 12px; font-family: monospace; }
    @media (max-width: 768px) { .main { grid-template-columns: 1fr; } .left-panel { border-right: none; border-bottom: 1px solid var(--border); } .right-panel { min-height: 400px; } }
  </style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<nav class="topbar">
  <a href="./index.html" class="logo-wrap">
    <img src="/logo.svg" alt="Logo">
    <span class="brand-name">My AI Chat</span>
  </a>
  <a href="./index.html" class="back-btn">← Back to Chat</a>
</nav>
<div class="main">
  <aside class="left-panel">
    <span class="panel-title">Image Generator</span>
    <div class="field-group">
      <label class="field-label">PROMPT</label>
      <textarea id="prompt" placeholder="e.g. boy on bicycle, sunset, cinematic, realistic..."></textarea>
    </div>
    <div class="field-group">
      <label class="field-label">STYLE</label>
      <div class="style-grid">
        <button class="style-btn active" data-style="">No Style</button>
        <button class="style-btn" data-style="photorealistic, 8k">Photorealistic</button>
        <button class="style-btn" data-style="anime style, vibrant">Anime</button>
        <button class="style-btn" data-style="oil painting, artistic">Oil Painting</button>
        <button class="style-btn" data-style="cinematic, dramatic lighting">Cinematic</button>
        <button class="style-btn" data-style="3d render, octane">3D Render</button>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">SIZE</label>
      <div class="presets">
        <button class="preset-btn active" data-w="1024" data-h="1024">1:1 Square</button>
        <button class="preset-btn" data-w="1344" data-h="768">16:9 Wide</button>
        <button class="preset-btn" data-w="768" data-h="1344">9:16 Portrait</button>
        <button class="preset-btn" data-w="1216" data-h="832">3:2</button>
      </div>
      <div class="size-row" style="margin-top:8px;">
        <div>
          <label class="field-label">WIDTH</label>
          <input id="width" type="number" min="256" max="2048" value="1024"/>
        </div>
        <div>
          <label class="field-label">HEIGHT</label>
          <input id="height" type="number" min="256" max="2048" value="1024"/>
        </div>
      </div>
    </div>
    <button class="generate-btn" id="generateBtn"><span>✦ Generate Image</span></button>
  </aside>
  <section class="right-panel">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎨</div>
      <p>Your image will appear here</p>
    </div>
    <div class="loading-screen" id="loadingScreen">
      <div class="logo-loader">
        <div class="logo-ring"></div>
        <div class="logo-ring2"></div>
        <img src="/logo.svg" alt="Logo">
      </div>
      <div>
        <div class="loading-text" id="loadingText">Generating your image...</div>
        <div class="loading-sub" id="loadingSub">This may take 20-40 seconds</div>
      </div>
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <div class="loading-bar-wrap"><div class="loading-bar" id="loadingBar"></div></div>
    </div>
    <div class="image-wrap" id="imageWrap">
      <div id="statusBadge"></div>
      <img id="output" alt="Generated image"/>
      <div class="image-actions">
        <button class="action-btn primary" id="downloadBtn">⬇ Download</button>
        <button class="action-btn" id="copyBtn">🔗 Copy URL</button>
        <button class="action-btn" id="regenerateBtn">↺ Regenerate</button>
      </div>
      <input id="imageUrl" type="text" readonly placeholder="Image URL"/>
    </div>
  </section>
</div>
<script>
  const promptEl=document.getElementById("prompt"),widthEl=document.getElementById("width"),heightEl=document.getElementById("height"),generateBtn=document.getElementById("generateBtn"),downloadBtn=document.getElementById("downloadBtn"),copyBtn=document.getElementById("copyBtn"),regenerateBtn=document.getElementById("regenerateBtn"),imageUrlEl=document.getElementById("imageUrl"),outputEl=document.getElementById("output"),loadingScreen=document.getElementById("loadingScreen"),loadingText=document.getElementById("loadingText"),loadingSub=document.getElementById("loadingSub"),imageWrap=document.getElementById("imageWrap"),emptyState=document.getElementById("emptyState"),statusBadge=document.getElementById("statusBadge"),loadingBar=document.getElementById("loadingBar");
  let currentStyle="",lastPrompt="";
  document.querySelectorAll(".style-btn").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll(".style-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentStyle=btn.dataset.style;});});
  document.querySelectorAll(".preset-btn").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll(".preset-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");widthEl.value=btn.dataset.w;heightEl.value=btn.dataset.h;});});
  const dict={"cycle":"bicycle","sawar":"riding","larki":"girl","larka":"boy","ghar":"house","gaari":"car","pani":"water","aasman":"sky","phool":"flower","darya":"river","pahar":"mountain","jungle":"forest","raat":"night","din":"day","suraj":"sun","chand":"moon","billi":"cat","kutta":"dog","ghora":"horse","chirya":"bird","admi":"man","aurat":"woman","bacha":"child","dost":"friend","khana":"food","chai":"tea","kitab":"book","shahar":"city","gaon":"village","sadak":"road","banao":"","bnao":"","kro":"","karo":"","generate":""};
  function preparePrompt(raw){let p=raw.toLowerCase();Object.keys(dict).forEach(k=>{p=p.replace(new RegExp(`\\b${k}\\b`,"gi"),dict[k]);});p=p.replace(/\s+/g," ").trim();if(!p||p.length<3)p=raw;if(currentStyle)p+=", "+currentStyle;p+=", high quality, HD, detailed";return p;}
  function buildUrl(prompt){const seed=Math.floor(Math.random()*99999999),w=Number(widthEl.value)||1024,h=Number(heightEl.value)||1024;return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&seed=${seed}&nologo=true`;}
  const loadingMessages=[["Crafting your vision...","AI is painting every pixel"],["Adding fine details...","Almost there, stay with us"],["Finalizing colors...","Your masterpiece is nearly ready"]];
  let msgIndex=0,msgInterval;
  function startLoading(){emptyState.style.display="none";imageWrap.classList.remove("show");loadingScreen.classList.add("show");generateBtn.disabled=true;loadingBar.style.animation="none";loadingBar.offsetHeight;loadingBar.style.animation="barFill 35s linear forwards";msgIndex=0;const[t,s]=loadingMessages[0];loadingText.textContent=t;loadingSub.textContent=s;msgInterval=setInterval(()=>{msgIndex=(msgIndex+1)%loadingMessages.length;const[tt,ss]=loadingMessages[msgIndex];loadingText.textContent=tt;loadingSub.textContent=ss;},8000);}
  function stopLoading(){loadingScreen.classList.remove("show");clearInterval(msgInterval);generateBtn.disabled=false;}
  function showImage(url,success=true){stopLoading();imageWrap.classList.add("show");statusBadge.innerHTML=success?`<div class="status-badge success">✓ Image Ready</div>`:`<div class="status-badge error">⚠ Load failed — try again</div>`;}
  function doGenerate(promptRaw){if(!promptRaw){promptEl.focus();return;}lastPrompt=promptRaw;const finalPrompt=preparePrompt(promptRaw),url=buildUrl(finalPrompt);imageUrlEl.value=url;startLoading();let tries=0;const maxTries=3;function tryLoad(){outputEl.onload=()=>showImage(url,true);outputEl.onerror=()=>{tries++;if(tries<maxTries){loadingText.textContent=`Retry ${tries}/${maxTries}...`;const newUrl=buildUrl(finalPrompt);imageUrlEl.value=newUrl;setTimeout(()=>{outputEl.src=newUrl;},3000);}else{showImage(url,false);}};outputEl.src=url;}tryLoad();}
  generateBtn.addEventListener("click",()=>doGenerate(promptEl.value.trim()));
  regenerateBtn.addEventListener("click",()=>doGenerate(lastPrompt||promptEl.value.trim()));
  promptEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.ctrlKey)doGenerate(promptEl.value.trim());});
  copyBtn.addEventListener("click",async()=>{if(!imageUrlEl.value)return;await navigator.clipboard.writeText(imageUrlEl.value);copyBtn.textContent="✓ Copied!";setTimeout(()=>copyBtn.innerHTML="🔗 Copy URL",2000);});
  downloadBtn.addEventListener("click",()=>{if(!outputEl.src)return;fetch(outputEl.src).then(r=>r.blob()).then(blob=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ai-image.png";a.click();}).catch(()=>window.open(outputEl.src,"_blank"));});
</script>
</body>
</html>
