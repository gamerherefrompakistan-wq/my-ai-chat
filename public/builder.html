<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Builder Tool</title>
    <link rel="stylesheet" href="./builder.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #0a0e1a;
        color: #eef2ff;
        min-height: 100vh;
      }

      /* ── SIDEBAR ── */
      .sidebar {
        position: fixed;
        top: 0; left: 0;
        width: 200px;
        height: 100vh;
        background: #0d1120;
        border-right: 1px solid rgba(255,255,255,0.06);
        display: flex;
        flex-direction: column;
        padding: 20px 0;
        z-index: 100;
      }

      .sidebar-logo {
        padding: 0 16px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .sidebar-logo img { height: 36px; }
      .sidebar-logo span { font-size: 14px; font-weight: 600; color: #fff; }

      .sidebar-nav { padding: 16px 8px; display: flex; flex-direction: column; gap: 4px; }

      .sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 8px;
        color: rgba(255,255,255,0.5);
        text-decoration: none;
        font-size: 13px;
        transition: all 0.2s;
      }

      .sidebar-nav a:hover { background: rgba(255,255,255,0.06); color: #fff; }
      .sidebar-nav a.active { background: rgba(99,102,241,0.15); color: #a5b4fc; }
      .sidebar-nav a span.icon { font-size: 16px; }

      .sidebar-bottom {
        margin-top: auto;
        padding: 12px 8px;
        border-top: 1px solid rgba(255,255,255,0.06);
      }

      .sidebar-bottom a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 8px;
        color: rgba(255,255,255,0.4);
        text-decoration: none;
        font-size: 13px;
        transition: all 0.2s;
      }

      .sidebar-bottom a:hover { background: rgba(255,255,255,0.06); color: #fff; }

      /* ── MAIN ── */
      .main-content {
        margin-left: 200px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── TOPBAR ── */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 24px;
        background: rgba(10,14,26,0.9);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        position: sticky;
        top: 0;
        z-index: 50;
      }

      .topbar-title { display: flex; flex-direction: column; }
      .topbar-title h1 { font-size: 18px; font-weight: 600; color: #fff; }
      .topbar-title p { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }

      .back-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        color: rgba(255,255,255,0.7);
        text-decoration: none;
        font-size: 13px;
        transition: all 0.2s;
      }

      .back-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

      /* ── GRID ── */
      .grid {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 0;
        flex: 1;
        height: calc(100vh - 61px);
      }

      /* ── LEFT PANEL ── */
      .left-panel {
        background: #0d1120;
        border-right: 1px solid rgba(255,255,255,0.06);
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .left-panel::-webkit-scrollbar { width: 4px; }
      .left-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

      .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        color: rgba(255,255,255,0.35);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 4px;
      }

      .section-title::before {
        content: '';
        width: 3px;
        height: 12px;
        background: #6366f1;
        border-radius: 2px;
      }

      .form-group { display: flex; flex-direction: column; gap: 6px; }

      .form-group label {
        font-size: 12px;
        color: rgba(255,255,255,0.5);
        font-weight: 500;
      }

      .form-group input,
      .form-group textarea {
        padding: 10px 12px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        color: #eef2ff;
        font-size: 13px;
        font-family: 'Segoe UI', Arial, sans-serif;
        outline: none;
        transition: border 0.2s, background 0.2s;
        resize: none;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        border-color: rgba(99,102,241,0.5);
        background: rgba(99,102,241,0.05);
      }

      .form-group input[type="color"] {
        padding: 4px 8px;
        height: 40px;
        cursor: pointer;
      }

      .form-group input[readonly] {
        color: rgba(255,255,255,0.3);
        font-size: 12px;
      }

      .image-preview {
        width: 100%;
        border-radius: 10px;
        display: none;
        margin-top: 8px;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .generate-img-btn {
        padding: 10px;
        background: rgba(99,102,241,0.15);
        border: 1px solid rgba(99,102,241,0.3);
        border-radius: 10px;
        color: #a5b4fc;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
      }

      .generate-img-btn:hover {
        background: rgba(99,102,241,0.25);
        border-color: rgba(99,102,241,0.5);
        color: #fff;
      }

      .generate-main-btn {
        padding: 13px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s;
        width: 100%;
        margin-top: 4px;
        box-shadow: 0 4px 20px rgba(99,102,241,0.3);
      }

      .generate-main-btn:hover { opacity: 0.88; }

      /* ── RIGHT PANEL ── */
      .right-panel {
        display: flex;
        flex-direction: column;
        background: #080b15;
        overflow: hidden;
      }

      .preview-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        background: rgba(10,14,26,0.8);
      }

      .preview-header span {
        font-size: 13px;
        font-weight: 600;
        color: rgba(255,255,255,0.6);
      }

      .preview-actions { display: flex; gap: 8px; }

      .action-btn {
        padding: 7px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
      }

      .action-btn.secondary {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        color: rgba(255,255,255,0.7);
      }

      .action-btn.secondary:hover {
        background: rgba(255,255,255,0.1);
        color: #fff;
      }

      .action-btn.primary {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
      }

      .action-btn.primary:hover { opacity: 0.85; }

      #preview {
        flex: 1;
        border: none;
        width: 100%;
        background: #fff;
      }

      .empty-preview {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: rgba(255,255,255,0.2);
      }

      .empty-preview .icon { font-size: 48px; opacity: 0.4; }
      .empty-preview p { font-size: 14px; }

      /* ── STATUS BAR ── */
      .status-bar {
        padding: 8px 20px;
        background: rgba(10,14,26,0.8);
        border-top: 1px solid rgba(255,255,255,0.06);
        font-size: 11px;
        color: rgba(255,255,255,0.3);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #22c55e;
      }
    </style>
  </head>
  <body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="/logo.svg" alt="Logo" style="background:transparent;">
        <span>My AI Chat</span>
      </div>
      <nav class="sidebar-nav">
        <a href="./index.html"><span class="icon">💬</span> Chat</a>
        <a href="./image-tool.html"><span class="icon">🖼️</span> Image Generator</a>
        <a href="./video-tool.html"><span class="icon">🎬</span> Video Generator</a>
        <a href="./builder.html" class="active"><span class="icon">🌐</span> Website Builder</a>
      </nav>
      <div class="sidebar-bottom">
        <a href="./index.html">← Back to Chat</a>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main-content">

      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar-title">
          <h1>🌐 Website Builder</h1>
          <p>AI se professional website banao seconds mein</p>
        </div>
        <a href="./index.html" class="back-btn">← Back to Chat</a>
      </header>

      <!-- GRID -->
      <div class="grid">

        <!-- LEFT: FORM -->
        <div class="left-panel">
          <form id="builder-form">

            <div class="section-title">PROMPT</div>

            <div class="form-group">
              <label>Business Name</label>
              <input id="businessName" required placeholder="e.g. Gamer Web Studio" />
            </div>

            <div class="form-group">
              <label>Tagline</label>
              <input id="tagline" placeholder="e.g. Fast websites for small businesses" />
            </div>

            <div class="form-group">
              <label>Business Type</label>
              <input id="businessType" placeholder="e.g. Digital agency, Restaurant, Salon" />
            </div>

            <div class="form-group">
              <label>Primary Color</label>
              <input id="primaryColor" type="color" value="#6366f1" />
            </div>

            <div class="form-group">
              <label>Logo Text</label>
              <input id="logoText" placeholder="e.g. GWS" />
            </div>

            <div class="form-group">
              <label>Prompt / Theme</label>
              <textarea id="promptText" rows="3" placeholder="e.g. Modern, trust-based, bold CTA, clean sections"></textarea>
            </div>

            <div class="section-title" style="margin-top:8px;">IMAGE</div>

            <div class="form-group">
              <label>Image Prompt</label>
              <textarea id="imagePrompt" rows="2" placeholder="e.g. modern web agency office, neon blue, professional team, cinematic lighting"></textarea>
            </div>

            <button id="generateImageBtn" type="button" class="generate-img-btn">🖼️ Generate Hero Image</button>
            <input id="generatedImageUrl" type="text" readonly placeholder="Generated image URL will appear here" style="margin-top:8px; padding:8px 12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:8px; color:rgba(255,255,255,0.3); font-size:12px; width:100%; outline:none;" />
            <img id="imagePreview" class="image-preview" alt="Generated preview" />

            <div class="section-title" style="margin-top:8px;">BUSINESS INFO</div>

            <div class="form-group">
              <label>Services (comma separated)</label>
              <input id="services" placeholder="e.g. Website Design, SEO, Branding" />
            </div>

            <div class="form-group">
              <label>WhatsApp Number</label>
              <input id="whatsapp" placeholder="e.g. 923001234567" />
            </div>

            <div class="form-group">
              <label>Contact Email</label>
              <input id="email" placeholder="e.g. hello@business.com" />
            </div>

            <button type="submit" class="generate-main-btn">✨ Generate Website</button>

          </form>
        </div>

        <!-- RIGHT: PREVIEW -->
        <div class="right-panel">
          <div class="preview-header">
            <span>OUTPUT</span>
            <div class="preview-actions">
              <button id="copyCodeBtn" type="button" class="action-btn secondary">Copy HTML</button>
              <button id="downloadBtn" type="button" class="action-btn primary">Download HTML</button>
            </div>
          </div>

          <div class="empty-preview" id="empty-preview">
            <div class="icon">🌐</div>
            <p>Fill the form and generate your website</p>
          </div>

          <iframe id="preview" title="Generated Website Preview" style="display:none;"></iframe>

          <div class="status-bar">
            <div class="status-dot"></div>
            Ready — fill details and click Generate Website
          </div>
        </div>

      </div>
    </div>

    <script src="./builder.js"></script>
    <script>
      // Show iframe when content is generated
      const origBuilderJS = window.onload;
      const previewFrame = document.getElementById('preview');
      const emptyPreview = document.getElementById('empty-preview');
      const statusBar = document.querySelector('.status-bar');

      // Watch iframe src changes
      const observer = new MutationObserver(() => {
        if (previewFrame.srcdoc || previewFrame.src) {
          emptyPreview.style.display = 'none';
          previewFrame.style.display = 'block';
          statusBar.innerHTML = '<div class="status-dot"></div> Website generated successfully!';
        }
      });
      observer.observe(previewFrame, { attributes: true, attributeFilter: ['srcdoc', 'src'] });
    </script>
  </body>
</html>
