<!doctype html>
<html lang="en">
  <head>
    <meta name="description" content="My AI Chat - Smart AI chatbot for website building, image generation and video generation.">
    <meta name="keywords" content="my ai chat, ai chatbot, website builder tool, image generator, video generator">
    <meta name="robots" content="index, follow">
    <title>My AI Chat - AI Powered Chatbot</title>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div id="login-modal" class="login-modal">
  <div class="login-box">

    <h2>Login Required</h2>
    <p>App use karne ke liye login karo</p>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button id="login-btn">Login</button>

  </div>
</div>
    <div class="layout">

      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="/index.html" style="text-decoration:none; display:inline-flex; align-items:center;">
            <img src="/logo.svg" alt="Logo" style="height: 36px;">
          </a>
          <button class="sidebar-toggle" id="close-sidebar">&#10005;</button>
        </div>

        <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>

        <div class="sidebar-section-title">Tools</div>

        <div class="sidebar-section-title">Chat History</div>
        <div class="chat-history" id="chat-history">
          <p class="no-history">No chats yet</p>
        </div>

        <div class="sidebar-footer">
          <button class="settings-btn" id="settings-btn">⚙️ Settings</button>
        </div>
      </aside>

      <!-- SETTINGS -->
      <div class="settings-panel" id="settings-panel" style="display:none;">
        <div class="settings-header">
          <span>Settings</span>
          <button id="close-settings">&#10005;</button>
        </div>

        <div class="settings-body">
          <label>Language</label>
          <select id="lang-select">
            <option value="roman_urdu">Roman Urdu</option>
            <option value="english">English</option>
          </select>

          <label style="margin-top:16px;">Theme</label>
          <select id="theme-select">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>

          <button class="clear-history-btn" id="clear-history-btn">🗑️ Clear All History</button>
        </div>
      </div>

      <div class="overlay" id="overlay"></div>

      <!-- UPGRADE MODAL -->
      <div id="upgrade-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#0f1117; border-radius:16px; border:1px solid rgba(255,255,255,0.12); width:90%; max-width:440px; overflow:hidden;">

          <div style="padding:1.5rem; text-align:center; border-bottom:1px solid rgba(255,255,255,0.08);">
            <div style="width:48px;height:48px;background:#6366f1;border-radius:12px;margin:auto;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:22px;">✨</div>
            <p style="font-size:20px;font-weight:600;color:#fff;margin:0;">Upgrade Your Plan</p>
            <p style="font-size:14px;color:rgba(255,255,255,0.5);margin:5px 0 0;">Free limit reached</p>
          </div>

          <div style="padding:1rem;">
            <div style="border:1px solid rgba(255,255,255,0.1);padding:1rem;border-radius:12px;">
              <p style="color:#fff;margin:0;font-weight:600;">Free Plan</p>
              <p style="color:rgba(255,255,255,0.5);margin:5px 0;">10 messages/day</p>
            </div>

            <div style="margin-top:10px;border:2px solid #6366f1;padding:1rem;border-radius:12px;">
              <p style="color:#fff;margin:0;font-weight:600;">Premium Plan</p>
              <p style="color:#fff;margin:5px 0;">Rs. 300/month</p>

              <button id="pay-btn" style="width:100%;margin-top:10px;padding:10px;background:#6366f1;color:#fff;border:none;border-radius:8px;cursor:pointer;">
                Pay via JazzCash / EasyPaisa
              </button>
            </div>
          </div>

          <div style="text-align:center;padding:10px;">
            <button id="close-modal-btn" style="background:none;border:none;color:#aaa;">Close</button>
          </div>

        </div>
      </div>

      <!-- MAIN -->
      <main class="app">

        <header class="topbar">
          <div style="display:flex; align-items:center; gap:10px;">
            <button class="menu-btn" id="open-sidebar">☰</button>

            <a href="/index.html" style="text-decoration:none; display:inline-flex; align-items:center;">
              <img src="/logo.svg" alt="Logo" style="height: 38px;">
            </a>
          </div>

          <!-- ✅ ONLY ONE TOP LINKS BLOCK -->
          <div class="top-links">
            <a class="tool-link" href="./builder.html">Website Builder Tool</a>
            <a class="tool-link" href="./image-tool.html">Image Generator Tool</a>
            <a class="tool-link" href="./video-tool.html">Video Generator Tool</a>

            <button id="get-plus-top-btn" class="tool-link">✨ Get Plus</button>
          </div>
        </header>

        <!-- CHAT -->
        <section id="chat" class="chat"></section>

        <!-- COMPOSER -->
        <form id="chat-form" class="composer">
          <input type="file" id="file-input" accept="image/*" style="display:none;">

          <button type="button" id="attach-btn">📎</button>

          <div class="composer-inner">
            <textarea id="prompt" rows="1" placeholder="Type your message..." required></textarea>
          </div>

          <button id="send-btn" type="submit">Send</button>
        </form>

        <!-- FOOTER -->
        <footer style="text-align:center; padding:15px; color:#555; font-size:13px;">
          Software developed by
          <a href="https://coding-agency.com/" target="_blank" style="color:white; font-weight:bold;">
            Coding Agency
          </a>
        </footer>

      </main>
    </div>

    <script src="./app.js"></script>

    <script>
      function showUpgradeModal() {
        document.getElementById('upgrade-modal').style.display = 'flex';
      }

      function hideUpgradeModal() {
        document.getElementById('upgrade-modal').style.display = 'none';
      }

      document.getElementById('close-modal-btn').addEventListener('click', hideUpgradeModal);

      document.getElementById('pay-btn').addEventListener('click', function () {
        const number = '03285087289';
        const msg = encodeURIComponent('Paid for premium plan');
        window.open('https://wa.me/92' + number.replace(/^0/, '') + '?text=' + msg, '_blank');
      });

      document.getElementById('get-plus-top-btn').addEventListener('click', showUpgradeModal);
    </script>

  </body>
</html>
