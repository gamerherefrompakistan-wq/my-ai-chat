<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT Style App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>My AI Chat</h1>
        <div class="top-links">
          <a class="tool-link" href="./builder.html">Website Builder Tool</a>
          <a class="tool-link" href="./image-tool.html">Image Generator Tool</a>
          <a class="tool-link" href="./video-tool.html">Video Generator Tool</a>
        </div>
      </header>

      <section id="chat" class="chat"></section>

      <form id="chat-form" class="composer">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Type your message..."
          required
        ></textarea>
        <button id="send-btn" type="submit">Send</button>
      </form>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
