<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Rainbow Infinity Logo</title>
  <desc>Colorful animated infinity loop with purple blue yellow orange red pink gradient</desc>
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9333ea"/>
      <stop offset="20%" style="stop-color:#3b82f6"/>
      <stop offset="40%" style="stop-color:#06b6d4"/>
      <stop offset="55%" style="stop-color:#eab308"/>
      <stop offset="75%" style="stop-color:#f97316"/>
      <stop offset="88%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="rainbow2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#9333ea"/>
      <stop offset="20%" style="stop-color:#ec4899"/>
      <stop offset="40%" style="stop-color:#ef4444"/>
      <stop offset="60%" style="stop-color:#eab308"/>
      <stop offset="80%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="35%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#9333ea; stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#9333ea; stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="65%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#f97316; stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#f97316; stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="35%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#ec4899; stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ec4899; stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowYellow" cx="65%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#eab308; stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#eab308; stop-opacity:0"/>
    </radialGradient>
  </defs>
  <style>
    
    .glow1 { animation: gPulse 3s ease-in-out infinite; }
    .glow2 { animation: gPulse 3s ease-in-out 0.5s infinite; }
    .glow3 { animation: gPulse2 3s ease-in-out 1s infinite; }
    .glow4 { animation: gPulse2 3s ease-in-out 1.5s infinite; }
    .infinity { animation: floatLoop 3s ease-in-out infinite; transform-origin: 340px 200px; }
    .dash1 { stroke-dasharray: 980; stroke-dashoffset: 980; animation: draw 2.5s cubic-bezier(0.4,0,0.2,1) infinite; }
    .dash2 { stroke-dasharray: 980; stroke-dashoffset: 980; animation: draw 2.5s cubic-bezier(0.4,0,0.2,1) 0.3s infinite; }
    @keyframes floatLoop { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.04) rotate(1deg); } }
    @keyframes gPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes gPulse2 { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    @keyframes draw { 0% { stroke-dashoffset: 980; opacity: 0.5; } 65% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
  </style>
  
  <ellipse class="glow1" cx="270" cy="190" rx="130" ry="90" fill="url(#glowPurple)"/>
  <ellipse class="glow2" cx="410" cy="190" rx="130" ry="90" fill="url(#glowOrange)"/>
  <ellipse class="glow3" cx="270" cy="220" rx="110" ry="70" fill="url(#glowPink)"/>
  <ellipse class="glow4" cx="410" cy="220" rx="110" ry="70" fill="url(#glowYellow)"/>
  <g class="infinity">
    <path d="M210,200 C210,138 260,100 308,138 C338,160 342,240 372,262 C420,300 470,260 470,200 C470,138 420,100 372,138 C342,160 338,240 308,262 C260,300 210,260 210,200 Z" fill="none" stroke="#111" stroke-width="50" stroke-linecap="round"/>
    <path class="dash1" d="M210,200 C210,138 260,100 308,138 C338,160 342,240 372,262 C420,300 470,260 470,200 C470,138 420,100 372,138 C342,160 338,240 308,262 C260,300 210,260 210,200 Z" fill="none" stroke="url(#rainbow)" stroke-width="42" stroke-linecap="round"/>
    <path class="dash2" d="M210,200 C210,138 260,100 308,138 C338,160 342,240 372,262 C420,300 470,260 470,200 C470,138 420,100 372,138 C342,160 338,240 308,262 C260,300 210,260 210,200 Z" fill="none" stroke="url(#rainbow2)" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
